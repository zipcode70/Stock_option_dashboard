name: On-Demand Options Indicators

# Manual-only: no schedule. Go to the Actions tab, click "Run workflow",
# type a ticker symbol (e.g. AAPL, QQQ, TSLA), and this computes a fresh
# 5-tab options indicators snapshot for that ticker and publishes it to
# GitHub Pages.

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker symbol to analyze (e.g. AAPL, QQQ, TSLA)"
        required: true
        default: "AAPL"

concurrency:
  group: indicators-update
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.commit.outputs.updated }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run indicators computation
        env:
          TICKER: ${{ github.event.inputs.ticker }}
        run: python3 scripts/compute_indicators.py

      - name: Commit updated data file(s)
        id: commit
        run: |
          git config user.name "indicators-bot"
          git config user.email "indicators-bot@users.noreply.github.com"
          git add site/data/*.json
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "On-demand indicators update: ${{ github.event.inputs.ticker }} ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-pages:
    needs: update-data
    if: needs.update-data.outputs.updated == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo (latest commit)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
